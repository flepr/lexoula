# Λεξούλα — publication de l'appli web sur GitHub Pages (app.lexoula.gr)
name: Appli web

on:
  push:
    branches: [main]
    paths-ignore: ["supabase/**", "docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # aperçu de la vitrine lexoula.gr (sera publiée sur son propre domaine)
      - run: node site/build.mjs --out dist/site --app ../ --privacy ../privacy.html --site https://app.lexoula.gr/site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
