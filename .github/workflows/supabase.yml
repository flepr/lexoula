# Λεξούλα — mise à jour de la base de données et du worker IA sur Supabase
name: Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROJECT_REF: bffjndnxeynyoseryfzs
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        id: check
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::Secrets GitHub manquants :$missing — déploiement Supabase ignoré."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest

      - name: Relier le projet
        if: steps.check.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations de la base
        if: steps.check.outputs.ok == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Clé de l'API Anthropic
        if: steps.check.outputs.ok == 'true' && env.ANTHROPIC_API_KEY != ''
        run: supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF"

      - name: Fonction worker
        if: steps.check.outputs.ok == 'true'
        run: supabase functions deploy worker --project-ref "$PROJECT_REF" --no-verify-jwt
