# Λεξούλα — diagnostic en lecture seule (file d'attente IA, cron, appels au worker)
name: Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: bffjndnxeynyoseryfzs
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Relier le projet
        run: supabase link --project-ref "$PROJECT_REF" --password "$PGPASSWORD" > /dev/null 2>&1
      - name: Requêtes
        run: |
          sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1 || true
          URL=$(cat supabase/.temp/pooler-url)
          q() {
            out=$(psql "$URL" -X -A -F ' | ' -P footer=off -c "$2" 2>&1 | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::notice title=$1::$out"
          }
          q jobs "select type, status, count(*), max(attempts) as max_att, left(max(last_error), 400) as err from public.jobs group by 1,2 order by 1,2"
          q jobs_recent "select id, type, mode, status, attempts, batch_id, run_after, updated_at, left(last_error, 300) as err from public.jobs order by updated_at desc limit 8"
          q batches "select id, status, cardinality(job_ids) as n, cached, created_at, polled_at, cancel_requested_at, processed_at from public.ai_batches order by created_at desc limit 6"
          q ai_usage "select job_type, kind, mode, count(*), sum(units) as words, sum(input_tokens) as inp, sum(cache_read_tokens) as cread, sum(cache_write_tokens) as cwrite, sum(output_tokens) as outp, round(sum(cost_usd), 4) as usd, round(sum(std_usd), 4) as std_usd from public.ai_usage group by 1,2,3 order by 1,2,3"
          q proofread "select id, status, payload->>'existing' as existing, left(coalesce(ctx->>'proposed', ''), 4) as proposed, left(coalesce(ctx->'applied', '[]')::text, 1200) as applied from public.jobs where type = 'proofread' order by id desc limit 10"
          q usd_eur "select value from public.app_config where key = 'usd_eur'"
          q texts_recent "select kind, status, left(title, 60) as title, created_at from public.texts order by created_at desc limit 4"
          q groups "select left(g.name, 40) as name, g.level, g.texts_enabled, g.archived, (select count(*) from public.lists l where l.group_id = g.id) as lists, (select count(distinct li.lexeme_id) from public.lists l join public.list_items li on li.list_id = l.id where l.group_id = g.id) as words, (select count(*) from public.texts t where t.group_id = g.id) as texts, (select count(*) from public.group_members m where m.group_id = g.id) as members from public.groups g order by g.created_at"
          q codes "select length(invite_code) as len, count(*), public.gen_invite_code() as new_code_sample from public.groups group by 1"
          q lexemes "select status, count(*) from public.lexemes group by 1"
          q cron "select j.jobname, d.status, left(d.return_message, 200) as msg, d.start_time from cron.job_run_details d join cron.job j using (jobid) order by d.start_time desc limit 6"
          q http "select id, status_code, timed_out, left(error_msg, 200) as err, left(content::text, 300) as body, created from net._http_response order by created desc limit 6"
          q roles "select role, count(*) from public.profiles group by 1 order by 1"
          q secret "select name, length(value) from private.secrets"
          q audio "select status, model, count(*), round(sum(seconds)::numeric, 0) as secs, round(sum(bytes)/1e6::numeric, 1) as mb, max(attempts) as max_att from public.audio group by 1,2 order by 1,2"
          q audio_err "select left(text, 40) as text, attempts, left(last_error, 300) as err, updated_at from public.audio where status <> 'ready' order by updated_at desc limit 6"
          q audio_cfg "select key, value from public.app_config where key in ('audio_state', 'audio_sweep')"
          q audio_cost "select model, count(*), sum(units) as files, sum(output_tokens) as out_tok, round(sum(cost_usd), 4) as usd from public.ai_usage where job_type = 'audio' group by 1"
          q audio_http "select r.id, r.status_code, left(r.content::text, 200) as body, r.created from net._http_response r order by r.created desc limit 3"
      - name: Traductions contenant du grec
        run: |
          sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1 || true
          URL=$(cat supabase/.temp/pooler-url)
          q() {
            out=$(psql "$URL" -X -A -F ' | ' -P footer=off -c "$2" 2>&1 | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::notice title=$1::$out"
          }
          G="'[\u0370-\u03ff\u1f00-\u1fff]'"
          q tr_greek_by_lang "select t.key as lang, count(*) from public.lexemes l, jsonb_each_text(l.data->'tr') t where t.value ~ $G group by 1 order by 1"
          q tr_greek_en "select l.input, t.value from public.lexemes l, jsonb_each_text(l.data->'tr') t where t.key = 'en' and t.value ~ $G order by 1"
          q tr_greek_fr "select l.input, t.value from public.lexemes l, jsonb_each_text(l.data->'tr') t where t.key = 'fr' and t.value ~ $G order by 1"
          q tr_greek_ru "select l.input, t.value from public.lexemes l, jsonb_each_text(l.data->'tr') t where t.key = 'ru' and t.value ~ $G order by 1"
          q noun_verb_tr "select l.input, l.data->'tr'->>'en' as en, l.data->'tr'->>'fr' as fr, l.data->>'forms' as forms from public.lexemes l where l.data->>'pos' = 'n' and (l.data->'tr'->>'en' ~ '(^|; )to ' or l.data->'tr'->>'fr' ~ '[a-zé]er( |$|;)') order by 1"
          q pair_notes "select l.input, l.data->>'forms' as forms, l.data->'tr' as tr, l.data->'note'->>'en' as note_en, l.data->'note'->>'fr' as note_fr, l.data->'note'->>'de' as note_de from public.lexemes l where l.input in ('το διαζύγιο', 'η πρόταση γάμου')"
