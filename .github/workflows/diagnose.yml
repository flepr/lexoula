# Λεξούλα — diagnostic en lecture seule (file d'attente IA, cron, appels au worker)
name: Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: bffjndnxeynyoseryfzs
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Relier le projet
        run: supabase link --project-ref "$PROJECT_REF" --password "$PGPASSWORD" > /dev/null 2>&1
      - name: Requêtes
        run: |
          sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1 || true
          URL=$(cat supabase/.temp/pooler-url)
          q() {
            out=$(psql "$URL" -X -A -F ' | ' -P footer=off -c "$2" 2>&1 | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::notice title=$1::$out"
          }
          q jobs "select type, status, count(*), max(attempts) as max_att, left(max(last_error), 400) as err from public.jobs group by 1,2 order by 1,2"
          q jobs_recent "select id, type, status, attempts, run_after, updated_at, left(last_error, 300) as err from public.jobs order by updated_at desc limit 6"
          q lexemes "select status, count(*) from public.lexemes group by 1"
          q cron "select j.jobname, d.status, left(d.return_message, 200) as msg, d.start_time from cron.job_run_details d join cron.job j using (jobid) order by d.start_time desc limit 6"
          q http "select id, status_code, timed_out, left(error_msg, 200) as err, left(content::text, 300) as body, created from net._http_response order by created desc limit 6"
          q roles "select role, count(*) from public.profiles group by 1 order by 1"
          q admin "select (select role from public.profiles where lower(email) = 'fabien@lepe.re') as microsoft_role, (select count(*) from public.groups g join public.profiles p on p.id = g.teacher_id where lower(p.email) = 'fabien@lepe.re') as classes_microsoft, (select count(*) from public.groups g join public.profiles p on p.id = g.teacher_id where lower(p.email) = 'fabien.lepere@me.com') as classes_old_account"
          q secret "select name, length(value) from private.secrets"
